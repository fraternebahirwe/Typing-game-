
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Speed Typing Pro — entraîne ta vitesse de frappe, améliore ta précision et bats tes records."
  />

  <meta
    name="theme-color"
    content="#050611"
  />

  <meta
    name="color-scheme"
    content="dark"
  />

  <title>Speed Typing Pro — Test de vitesse</title>

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="./style.css"
  />

  <!-- JavaScript -->
  <script
    src="./script.js"
    defer
  ></script>
</head>


<body>

  <!-- ================================================================
       MAIN APPLICATION
       ================================================================ -->

  <main class="app">

    <!-- ==============================================================
         HEADER
         ============================================================== -->

    <header class="app-header">

      <div
        class="badge"
        aria-label="Speed Typing Pro"
      >
        <span aria-hidden="true">⚡</span>
        SPEED TYPING PRO
      </div>

      <h1>
        Tape plus vite
      </h1>

      <p class="subtitle">
        Entraîne tes doigts. Bats tes records. Deviens légende.
      </p>

    </header>


    <!-- ==============================================================
         GAME
         ============================================================== -->

    <section
      class="game-card"
      aria-labelledby="game-title"
    >

      <!-- Hidden accessible title -->
      <h2
        id="game-title"
        class="sr-only"
      >
        Jeu de vitesse de frappe
      </h2>


      <!-- ============================================================
           GAME MODES
           ============================================================ -->

      <div
        class="mode-box"
        role="group"
        aria-label="Choisir un mode de jeu"
      >

        <button
          type="button"
          class="mode active"
          data-mode="words"
          aria-pressed="true"
        >
          <span aria-hidden="true">✦</span>
          Mots
        </button>

        <button
          type="button"
          class="mode"
          data-mode="phrases"
          aria-pressed="false"
        >
          <span aria-hidden="true">◈</span>
          Phrases
        </button>

      </div>


      <!-- ============================================================
           PROGRESS
           ============================================================ -->

      <div
        class="progress"
        role="progressbar"
        aria-label="Progression du jeu"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div
          class="progress-bar"
          id="progressBar"
        ></div>
      </div>


      <!-- ============================================================
           CURRENT WORD
           ============================================================ -->

      <div
        class="word-box"
        aria-live="polite"
        aria-atomic="true"
      >

        <span id="word">
          rapide
        </span>

      </div>


      <!-- ============================================================
           TYPING FORM
           ============================================================ -->

      <form
        class="input-row"
        id="typingForm"
        novalidate
      >

        <label
          for="input"
          class="sr-only"
        >
          Tape le mot affiché
        </label>

        <input
          type="text"
          id="input"
          name="typingInput"
          placeholder="Tape ici..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="done"
          aria-describedby="typingHint"
          required
        />

        <button
          type="submit"
          id="validateBtn"
        >
          Valider
          <span aria-hidden="true">→</span>
        </button>

      </form>

      <p
        id="typingHint"
        class="sr-only"
      >
        Tape le mot affiché puis valide ta réponse.
      </p>


      <!-- ============================================================
           STATISTICS
           ============================================================ -->

      <section
        class="stats"
        aria-label="Statistiques de la partie"
      >

        <article class="stat">

          <h2 id="score">
            0
          </h2>

          <p>
            Bons
          </p>

        </article>


        <article class="stat">

          <h2 id="total">
            0
          </h2>

          <p>
            Total
          </p>

        </article>


        <article class="stat">

          <h2 id="precision">
            —
          </h2>

          <p>
            Précision
          </p>

        </article>

      </section>


      <!-- ============================================================
           SHARE
           ============================================================ -->

      <button
        type="button"
        class="share-btn"
        id="shareBtn"
      >
        <span aria-hidden="true">✉️</span>
        Partager mon score
      </button>

    </section>


    <!-- ==============================================================
         FOOTER
         ============================================================== -->

    <footer>

      <p>
        Fait avec
        <span aria-hidden="true">❤️</span>
        par

        <a
          href="https://github.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Profil GitHub de Fraterne Bahirwe"
        >
          Fraterne Bahirwe
        </a>
      </p>

    </footer>

  </main>

</body>

</html>
